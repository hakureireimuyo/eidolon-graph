[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-graph"
version = "0.1.0"
description = "Eidolon 图运行时内核 —— 图模型 + 执行引擎 + 内置节点;编辑器与运行时共同依赖的稳定核心"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["eidolon_graph*"]

# 内核零第三方依赖:模型与执行语义为纯 Python;节点由宿主注册(编辑器 stub / eidolon-runtime 真实现)。
# 消费方(eidolon-runtime / 图编辑服务)以 git 源 + pin rev 依赖本库,见各消费方 pyproject 的 [tool.uv.sources]。
