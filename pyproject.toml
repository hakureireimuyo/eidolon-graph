[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-graph"
version = "0.1.0"
description = "Eidolon 图运行时内核 —— 图模型 + 执行引擎 + 内置节点;编辑器与运行时共同依赖的稳定核心"
requires-python = ">=3.11"
# 内核核心零第三方依赖(模型与执行语义为纯 Python);
# eidolon-llm 是节点封装层(eidolon_graph/nodes/llm)引用的能力库——
# 能力在库、包装在内核;库本身零外部依赖、零图概念。
dependencies = [
    "eidolon-llm",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["eidolon_graph*"]

[tool.uv.sources]
eidolon-llm = { git = "ssh://git@github.com/hakureireimuyo/eidolon-llm.git", rev = "8121ece704f1311b33e02826308060a9501de2a5" }
